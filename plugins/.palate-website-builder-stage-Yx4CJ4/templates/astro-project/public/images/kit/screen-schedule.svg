  <text x="1360" y="372" class="sm m num" font-size="18">8:00am</text>
  <rect x="1478" y="350" width="62" height="28" fill="var(--sage)" rx="14"/><text x="1509" y="370" class="lbl" text-anchor="middle" font-size="16">Done</text>
  <rect x="1338" y="614" width="212" height="132" fill="var(--panel)" rx="10"/>
  <rect x="1338" y="614" width="5" height="132" fill="var(--steel)" rx="3"/>
  <text x="1360" y="658" class="sm" font-weight="600">Harbourline</text>
  <text x="1360" y="690" class="sm m">Make good</text>
  <text x="1360" y="724" class="sm m num" font-size="18">8:00am</text>
  
  <text x="280" y="858" class="lbl m">Unassigned</text>
  <rect x="280" y="880" width="420" height="84" fill="var(--paper)" rx="10" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
