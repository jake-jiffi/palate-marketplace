  <text x="1128" y="548" class="sm m num" font-size="18">8:00am</text>
  <rect x="1246" y="526" width="62" height="28" fill="var(--sand)" rx="14"/><text x="1277" y="546" class="lbl" text-anchor="middle" font-size="16">Late</text>
  <rect x="1338" y="262" width="212" height="132" fill="var(--panel)" rx="10"/>
