  <rect x="718" y="900" width="26" height="26" fill="#cfd9c7" rx="5"/><text x="754" y="921" class="sm m num" font-size="18">4-10</text>
  <rect x="836" y="900" width="26" height="26" fill="#b6c5aa" rx="5"/><text x="872" y="921" class="sm m num" font-size="18">11-20</text>
  <rect x="954" y="900" width="26" height="26" fill="#9ab189" rx="5"/><text x="990" y="921" class="sm m num" font-size="18">21-35</text>
  <rect x="1072" y="900" width="26" height="26" fill="#7d9a6b" rx="5"/><text x="1108" y="921" class="sm m num" font-size="18">36+</text>
