<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A paddock map shaded by days since last grazed, with two mobs pinned">
  <title>A paddock map shaded by days since last grazed, with two mobs pinned</title>
  <style>
    svg{--ink:var(--kit-text,#1b1d21);--muted:var(--kit-text-muted,#6e737b);--paper:var(--kit-bg,#ffffff);--panel:var(--kit-bg-subtle,#f3f4f6);--line:var(--kit-border,#dfe2e6);--steel:#46525d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    text{fill:var(--ink)}
    .m{fill:var(--muted)}
    .w{fill:#fff}
    .lbl{font-size:19px;letter-spacing:.06em;text-transform:uppercase}
    .sm{font-size:20px}
    .md{font-size:24px}
    .lg{font-size:30px;font-weight:600}
    .xl{font-size:40px;font-weight:600;letter-spacing:-.01em}
    .num{font-variant-numeric:tabular-nums}
    .ln{stroke:var(--line);stroke-width:2}
  </style>
  <rect x="0" y="0" width="1600" height="1000" fill="var(--paper)"/>
  <rect x="0" y="0" width="248" height="1000" fill="var(--panel)"/>
  <line x1="248" y1="0" x2="248" y2="1000" class="ln"/>
  <rect x="0" y="0" width="1600" height="78" fill="var(--paper)"/>
  <line x1="0" y1="78" x2="1600" y2="78" class="ln"/>
  <rect x="40" y="26" width="26" height="26" fill="var(--steel)" rx="6"/>
  <text x="80" y="48" class="md" font-weight="600">Paddockline</text>
