  <text x="1513" y="48" class="sm w" text-anchor="middle">RB</text>
  <text x="40" y="122" class="lbl m">Nine Mile</text>
  <rect x="20" y="144" width="208" height="50" fill="var(--paper)" rx="8"/><rect x="40" y="160" width="18" height="18" fill="var(--steel)" rx="4"/><text x="72" y="178" class="sm" font-weight="600">Map</text>
  <rect x="40" y="222" width="18" height="18" fill="var(--muted)" rx="4"/><text x="72" y="240" class="sm m">Mobs</text>
  <rect x="40" y="284" width="18" height="18" fill="var(--muted)" rx="4"/><text x="72" y="302" class="sm m">Treatments</text>
  <rect x="40" y="346" width="18" height="18" fill="var(--muted)" rx="4"/><text x="72" y="364" class="sm m">Rainfall</text>
  <rect x="40" y="408" width="18" height="18" fill="var(--muted)" rx="4"/><text x="72" y="426" class="sm m">Reports</text>
