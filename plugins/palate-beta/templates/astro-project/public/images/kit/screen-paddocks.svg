  <polygon points="949,534 1254,541 1263,687 962,682" fill="#7d9a6b" stroke="#ffffff" stroke-width="4"/>
  <text x="1107" y="611" class="sm" text-anchor="middle" font-size="18" fill="#ffffff">Dam</text>
  <polygon points="962,682 1263,687 1269,860 973,856" fill="#cfd9c7" stroke="#ffffff" stroke-width="4"/>
  <text x="1117" y="771" class="sm" text-anchor="middle" font-size="18">Lane</text>
  <polygon points="1231,276 1534,290 1543,541 1254,541" fill="#9ab189" stroke="#ffffff" stroke-width="4"/>
